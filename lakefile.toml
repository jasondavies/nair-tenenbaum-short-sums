name = "nair_tenenbaum"
version = "0.1.0"
defaultTargets = ["NairTenenbaum", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "NairTenenbaum"

# Deliberate statement placeholders are confined to Challenge.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
