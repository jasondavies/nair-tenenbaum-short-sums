automation:
  methods:
    - method: agent
      framework: "OpenAI Codex"
      tool_setup: >-
        An AI coding agent with shell access, Lean 4.35.0, Mathlib, and Lake
        produced the Lean development, proof map, axiom audit, and submission
        packaging under Jason Davies's direction. Exact model identifiers are
        not recorded in this repository. No AXLE or external proof service was used.
      cost:
        wall_time: "about 12 hours of proof-development work; submission preparation was additional"
        spend_usd: "not tracked"
      prompting_notes: >-
        Asked to formalize the paper using the author's CCDN dimension-growth
        and Iwaniec linear-sieve repositories as examples; subsequently asked
        to prepare the completed development for Palomar submission.
  notes: >-
    Material proof construction and documentation were generated by the agent.
    The human directed the task and confirmed the author, maintainer, and
    Apache-2.0 license. Ordinary Lean kernel checks and the project-wide axiom
    audit were used throughout. Deliberate Challenge theorem placeholders are
    excluded from the unresolved-proof counts above; there are no definition holes.

fidelity:
  divergences: >-
    The main theorems retain their stated coefficient and discriminant uniformity.
    Arithmetic functions are defined on positive tuples and extended by zero at
    a zero polynomial value, making otherwise undefined terms explicit. Polynomial
    factorization data are supplied in the compared statements and constructed in
    additional library interfaces. Theorem 2 explicitly assumes positive polynomial
    degree and fixes the integer k before choosing its threshold. The o(1)
    exponents in the Hooley corollaries are expressed by every coefficient eta
    strictly greater than the stated limiting coefficient, with corresponding
    thresholds. Corollary 6 requires positive degree of the restricted coordinate;
    a checked constant-unit-coordinate example shows the saving can otherwise
    fail. Corollary 7 corrects the printed transposed interval condition to
    x^(4 epsilon) <= y <= x. Corollary 9 makes explicit the range
    1 <= |a| <= x inherited from Corollary 8, hence applies eventually to each
    fixed nonzero residue. The printed Lemma 1 is refuted by a checked arithmetic
    counterexample for Q=X; the totient and selected-prime comparisons actually
    used by the main proofs are proved separately. The proof of Theorem 1 replaces
    a single-gcd removal by removal of whole bad prime powers. The proof of
    Theorem 3 handles the small fixed primes that adjoining X can introduce.
    These proof repairs do not weaken the main theorem statements. See
    BLUEPRINT.md and docs/completion-audit.yaml for the declaration-level map.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    The producing agent checked source alignment, compiled every proof, and ran
    the transitive axiom audit. No independent human mathematical review is
    recorded. Challenge and Solution both compile. The compiled theorem types
    and all 19,610 transitive statement constants agree exactly, checked by
    scripts/CheckStatements.lean. The complete axiom audit covers 3,032 library
    and Solution declarations. On 2026-10-30 the refactored working tree also
    passed scripts/verify-comparator.sh with host permissions for Bubblewrap's
    namespace sandbox. Sandboxed Comparator exported the proofs, and con-ron,
    NanoDa, and Lean's default kernel all accepted the solution. This metadata
    does not claim Palomar review or registration.

