    authors: ["Mohan Nair", "Gérald Tenenbaum"]
    id: "doi:10.1007/BF02392880"
    type: "paper"
    location: "Acta Mathematica 180 (1998), 119–144; Theorems 1–3, Corollaries 1–10, Lemmas 1–2"
    relationship: formalizes
    note: >-
      All fifteen numbered results are accounted for in docs/completion-audit.yaml
      and BLUEPRINT.md. Fourteen proved statements are compared; the false printed
      Lemma 1 is not asserted. Scope corrections are recorded under fidelity.
      No source-author endorsement is recorded.
    license: "unknown"
    author_endorsement: other
  - title: "Sur une question d’Erdős et Schinzel, II"
    authors: ["Gérald Tenenbaum"]
    id: "Inventiones Mathematicae 99 (1990), 215–224"
    type: "paper"
    location: "Lemma 2.2 and its weighted Hooley mean argument, cited as [9] in Nair–Tenenbaum"
    relationship: adapts
    note: >-
      The needed weighted mean and prime-root estimates are proved in this
      repository, rather than assumed from the literature. The proof map records
      the adaptations. No source-author endorsement is recorded.
    license: "unknown"
    author_endorsement: other

