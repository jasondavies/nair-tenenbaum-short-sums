version: "v0.4"

project:
  name: "Short sums of certain arithmetic functions (Nair–Tenenbaum)"
  description: >-
    A Lean 4 formalization of Nair and Tenenbaum's uniform upper bounds for short
    sums of nonnegative arithmetic functions evaluated at integer polynomial
    values. Theorem 1 retains the coefficient-independent height threshold and
    the restricted-discriminant dependence of the bound. Theorem 2 gives a
    greatest-prime-factor bound with a strict exponential gain for arbitrary
    nonconstant irreducible integer polynomials, including those with fixed
    prime divisors. Theorem 3 treats prime arguments with the explicit
    constant-term correction. The development also proves the ten corollaries
    on progressions, Hooley moments, smooth values, shifted primes, dyadic
    averages, and Goldbach representations, and Lemma 2 for general class-M
    weights. Corollary 6 has an explicit nonconstancy condition; the printed
    Lemma 1 has a checked counterexample and the required replacements are proved.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N37", "11N36", "11N25", "11N32"]

