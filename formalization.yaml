    Solution.lean proves definitionally identical wrappers from the library declarations.
    PolynomialSystem supplies the algebraic factorization in equation (9),
    including irreducibility, pairwise nonassociation, and no fixed prime divisor;
    it contains no analytic estimate or assumed literature theorem. The library
    also constructs factorization data for original polynomial families and
    exports family interfaces. Those extra interfaces, the counterexamples,
    replacement comparisons, and supporting results are audited as library proofs
    but are not separate Comparator claims. All fifteen numbered statements are
    mapped in README.md and docs/completion-audit.yaml, with corrections explicit.
